<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mengarahkan ke Bubakan Green...</title>
  <script>
    (function() {
      var id = new URLSearchParams(window.location.search).get('id');
      if (id) {
        window.location.replace('/?plant=' + encodeURIComponent(id));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>Mengarahkan ke <a href="/">Bubakan Green</a>...</p>
</body>
</html>
